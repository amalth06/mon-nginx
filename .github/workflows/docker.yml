
name: mon1pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t mon-nginx .

      - name: Lancer le conteneur
        run: docker run -d --name test-nginx -p 8080:80 mon-nginx

      - name: Tester l'image Docker
        run: docker run -d -p 8081:80 --name test-nginx mon-nginx

      - name: Vérifier le serveur
        run: curl --fail http://localhost:8081

      - name: Arrêter le conteneur
        run: docker stop test-nginx

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Déploiement
        run: echo "Déploiement réussi !"
