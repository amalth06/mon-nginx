name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t mon-nginx .
- name: Lancer le conteneur
        run: docker run -d --name test-nginx -p 8080:80 mon-nginx

      - name: Tester Nginx
        run: curl -f http://localhost:8080
