name: mon1pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write


jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: true
          tags: ghcr.io/amalth06/mon-nginx:v1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
       

      - name: Tester l'image Docker
        run: |
          docker rm -f test-nginx || true
          docker run -d -p 8081:80 --name test-nginx mon-nginx:v1.0

      - name: Vérifier le serveur
        run: |
          sleep 2
          curl --fail http://localhost:8081

      - name: Arrêter le conteneur
        run: docker stop test-nginx
      - name: Créer un artifact
        run: echo "Pipeline de Amalth terminé" > resultat.txt

      - name: Sauvegarder l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: resultat-pipeline
          path: resultat.txt
  deploy:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Déploiement
        run: echo "Déploiement réussi !"
